services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ideahub-postgres
    environment:
      POSTGRES_DB: ideahub
      POSTGRES_USER: ideahub
      POSTGRES_PASSWORD: ideahub
    ports:
      - "5432:5432"
    volumes:
      - ideahub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideahub -d ideahub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ideahub-postgres-data:
