services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ideahub
      POSTGRES_USER: ideahub
      POSTGRES_PASSWORD: ideahub
    volumes:
      - ideahub-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideahub -d ideahub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3333
      DATABASE_URL: postgres://ideahub:ideahub@postgres:5432/ideahub
      WEB_ORIGIN: http://localhost:8080
      SESSION_SECRET: local-prod-compose-secret
      IDEAHUB_FEATURE_SET: obsidian-core-command-bookmarks-utilities
      IDEAHUB_COVERAGE_DOC: docs/obsidian-coverage.md
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3333/api
    ports:
      - "8080:80"
    depends_on:
      - api

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    environment:
      IDEAHUB_API_BASE_URL: http://api:3333/api
    profiles:
      - mcp
    depends_on:
      - api

volumes:
  ideahub-prod-postgres-data:
