apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideahub-api
  namespace: ideahub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ideahub-api
  template:
    metadata:
      labels:
        app: ideahub-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/ideahub-api:latest
          ports:
            - containerPort: 3333
          envFrom:
            - configMapRef:
                name: ideahub-config
            - secretRef:
                name: ideahub-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3333
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3333
---
apiVersion: v1
kind: Service
metadata:
  name: ideahub-api
  namespace: ideahub
spec:
  selector:
    app: ideahub-api
  ports:
    - name: http
      port: 3333
      targetPort: 3333
